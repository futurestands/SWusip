name: SWUSIP source integrity
on:
  push:
    branches: [feature/swusip-call-centre]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baresip-studio-master
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 scripts/check_sip_source.py
      - run: python3 scripts/test_source_integrity.py
      - run: python3 scripts/audit_translations.py
      - run: python3 scripts/test_translations.py
      - run: python3 scripts/test_device_privacy.py
      - run: python3 -m py_compile scripts/verify_native.py scripts/prepare_native.py
      - run: git diff --check
      - name: Scan public locked native commits
        run: python3 scripts/scan_native_dependencies.py
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .native-build/ci-tools
          cd .native-build/ci-tools
          curl -fsSL --retry 2 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git ../../.. --redact --no-banner
